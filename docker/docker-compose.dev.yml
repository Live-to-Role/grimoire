services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: "no"

  grimoire:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ${PDF_LIBRARY_PATH:-./pdfs}:/library:ro
      - ${PDF_LIBRARY_PATH_2:-./pdfs}:/library2:ro
      - ${PDF_LIBRARY_PATH_3:-./pdfs}:/library3:ro
      - ./backend/grimoire:/app/grimoire:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/grimoire.db
      - REDIS_URL=redis://redis:6379/0
      - LIBRARY_PATH=/library
      - DATA_DIR=/app/data
      - COVERS_DIR=/app/data/covers
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8000"]
      # .env's localhost:11434 points at this container, not the host
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    command: ["uvicorn", "grimoire.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      # Native Docker in WSL: route host.docker.internal to the WSL host (where Ollama runs)
      - "host.docker.internal:host-gateway"
    restart: "no"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    volumes:
      - ./data:/app/data
      - ${PDF_LIBRARY_PATH:-./pdfs}:/library:ro
      - ${PDF_LIBRARY_PATH_2:-./pdfs}:/library2:ro
      - ${PDF_LIBRARY_PATH_3:-./pdfs}:/library3:ro
      - ./backend/grimoire:/app/grimoire:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/grimoire.db
      - REDIS_URL=redis://redis:6379/0
      - LIBRARY_PATH=/library
      - DATA_DIR=/app/data
      - COVERS_DIR=/app/data/covers
      - LOG_LEVEL=DEBUG
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    command: ["python", "-m", "huey.bin.huey_consumer", "grimoire.worker.tasks.huey", "-w", "2", "-k", "thread"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Worker runs Huey, not the HTTP API — disable the image's inherited HTTP healthcheck
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      - grimoire
      - redis

volumes:
  redis_data:
