services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  grimoire:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - grimoire_data:/app/data
      - ${PDF_LIBRARY_PATH:-./pdfs}:/library:ro
      - ${PDF_LIBRARY_PATH_2:-./pdfs}:/library2:ro
      - ${PDF_LIBRARY_PATH_3:-./pdfs}:/library3:ro
      - ./backend/grimoire:/app/grimoire:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/grimoire.db
      - REDIS_URL=redis://redis:6379/0
      - LIBRARY_PATH=/library
      - DATA_DIR=/app/data
      - COVERS_DIR=/app/data/covers
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:3000","http://localhost:8000"]
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CODEX_API_URL=${CODEX_API_URL:-https://codex-api.livetorole.com/api/v1}
    extra_hosts:
      # Ollama runs on the host; host-gateway makes host.docker.internal
      # resolve on native Linux Docker too, not just Docker Desktop.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The app takes ~50s to import and start; a shorter grace period marks
      # it unhealthy on every boot before it self-heals on the next probe.
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - grimoire
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Drains ProcessingQueue: text extraction, covers, AI identify, embeddings.
  # Without this service every queued item stays "pending" forever — the Huey
  # consumer below only schedules folder scans.
  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    volumes:
      - grimoire_data:/app/data
      - ${PDF_LIBRARY_PATH:-./pdfs}:/library:ro
      - ${PDF_LIBRARY_PATH_2:-./pdfs}:/library2:ro
      - ${PDF_LIBRARY_PATH_3:-./pdfs}:/library3:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/grimoire.db
      - REDIS_URL=redis://redis:6379/0
      - LIBRARY_PATH=/library
      - DATA_DIR=/app/data
      - COVERS_DIR=/app/data/covers
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CODEX_API_URL=${CODEX_API_URL:-https://codex-api.livetorole.com/api/v1}
    command: ["python", "-m", "grimoire.worker.run"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Runs a polling loop, not the HTTP API — disable the image's healthcheck
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      - grimoire

  # Schedules periodic folder scans (Huey). Does not process the queue.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    volumes:
      - grimoire_data:/app/data
      - ${PDF_LIBRARY_PATH:-./pdfs}:/library:ro
      - ${PDF_LIBRARY_PATH_2:-./pdfs}:/library2:ro
      - ${PDF_LIBRARY_PATH_3:-./pdfs}:/library3:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/grimoire.db
      - LIBRARY_PATH=/library
      - DATA_DIR=/app/data
      - COVERS_DIR=/app/data/covers
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CODEX_API_URL=${CODEX_API_URL:-https://codex-api.livetorole.com/api/v1}
    command: ["python", "-m", "huey.bin.huey_consumer", "grimoire.worker.tasks.huey", "-w", "2", "-k", "thread"]
    extra_hosts:
      # Ollama runs on the host; host-gateway makes host.docker.internal
      # resolve on native Linux Docker too, not just Docker Desktop.
      - "host.docker.internal:host-gateway"
    # Worker runs Huey, not the HTTP API — disable the image's inherited HTTP healthcheck
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      - grimoire

volumes:
  grimoire_data:
  redis_data:
